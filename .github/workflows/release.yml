name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (for example 0.2.0)"
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          export RELEASE_VERSION="$version"
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('Sources/LidCodeKit/Model/LidCodeVersion.swift')
          path.write_text(re.sub(r'static let current = "[^"]+"', 'static let current = "' + os.environ['RELEASE_VERSION'] + '"', path.read_text()))
          PY
      - name: Test
        run: swift test
      - name: Build and verify download artifacts
        env:
          BUILD: ${{ github.run_number }}
          SIGN: "-"
        run: bash Script/package-release.sh
      - name: Retain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lidcode-${{ steps.version.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            "dist/Lidcode-$RELEASE_VERSION.dmg" \
            "dist/Lidcode-$RELEASE_VERSION.zip" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Lidcode $RELEASE_VERSION" \
            --notes-file docs/INSTALL.md
